<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BACKSTAB</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:sans-serif}#game{width:100vw;height:100vh;display:block}#hud{position:fixed;top:8px;left:8px;display:flex;gap:14px;z-index:5;background:#fff8;padding:6px}#touchControls{position:fixed;inset:0;z-index:10;pointer-events:none}#lookArea{position:absolute;left:45%;top:0;width:55%;height:100%;pointer-events:auto;touch-action:none}#stick{position:absolute;left:35px;bottom:35px;width:120px;height:120px;border:3px solid white;border-radius:50%;background:#0006;pointer-events:auto;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:#fff8;pointer-events:none}#stabTouch{position:absolute;right:35px;bottom:45px;width:120px;height:70px;border:3px solid white;border-radius:18px;background:#d22;color:white;font-weight:bold;font-size:22px;pointer-events:auto;touch-action:none}
</style>
</head>
<body>
<div id="controlPrompt"><h2>Choose Controls</h2><p>This choice only applies to this game session.</p><button type="button" onclick="window.selectBackstabControls('keyboard')">Keyboard + Mouse</button> <button type="button" onclick="window.selectBackstabControls('touch')">Touch</button><p id="controlError"></p></div>
<main id="menu" hidden><h1>BACKSTAB</h1><p>Random arenas. Hunt the other players.</p><p><button id="hostTab" type="button">Host</button> <button id="joinTab" type="button">Join</button></p><section id="hostPanel"><h2>Host</h2><p>Party code: <strong id="partyCode">----</strong></p><p id="hostWait">Press Host to create a party.</p><button id="hostBtn" type="button">Host</button></section><section id="joinPanel" hidden><h2>Join</h2><p>Enter the host's 4-character party code.</p><input id="partyInput" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD" aria-label="Party code"><button id="joinBtn" type="button">Join</button></section><p id="status">Choose Host or Join.</p></main>
<canvas id="game" hidden></canvas>
<div id="hud" hidden><strong>BACKSTAB</strong><span id="mapName">Arena</span><span id="players">Players: 1</span><span id="state">Waiting...</span><span id="controlHint">WASD · mouse · SPACE</span></div>
<div id="touchControls" hidden><div id="lookArea" aria-label="Touch look area"></div><div id="stick" aria-label="Movement joystick"><div id="knob"></div></div><button id="stabTouch" type="button">STAB</button></div>
<script>
window.selectBackstabControls=function(mode){mode=mode==='touch'?'touch':'keyboard';window.gameControlMode=mode;var p=document.getElementById('controlPrompt'),m=document.getElementById('menu');if(p)p.hidden=true;if(m)m.hidden=false;if(typeof window.chooseBackstabControls==='function')window.chooseBackstabControls(mode)};
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.addEventListener('error',function(e){var x='Game script error: '+(e.message||'unknown error'),s=document.getElementById('status'),p=document.getElementById('controlError');if(s)s.textContent=x;if(p)p.textContent=x});window.addEventListener('unhandledrejection',function(e){var x='Game error: '+(e.reason&&e.reason.message?e.reason.message:e.reason||'unknown error'),s=document.getElementById('status'),p=document.getElementById('controlError');if(s)s.textContent=x;if(p)p.textContent=x});</script>
<script src="game2.js?v=network-fix-5"></script>
<script>
(function(){
if(typeof Peer==='undefined')return;
const $=id=>document.getElementById(id),setStatus=s=>{if($('status'))$('status').textContent=s;console.log('[BACKSTAB]',s)};
// Force TURN for this test. If relay-only succeeds, the previous failures were
// caused by direct ICE/NAT traversal rather than the PeerJS signaling server.
const ice={iceTransportPolicy:'relay',iceServers:[
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turns:staticauth.openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}
]};
const peerId=code=>'backstab-'+code.toLowerCase();
const errorText=e=>(e&&e.type?e.type:'unknown')+(e&&e.message&&e.message!==e.type?' — '+e.message:'');
function newPeer(id){return new Promise((resolve,reject)=>{let p;try{p=id?new Peer(id,{config:ice,debug:3}):new Peer({config:ice,debug:3})}catch(e){reject(e);return}peer=p;let done=false;const timer=setTimeout(()=>{if(done)return;done=true;try{p.destroy()}catch(e){}reject(new Error('PeerJS signaling timed out'))},15000);p.on('open',()=>{if(done)return;done=true;clearTimeout(timer);resolve(p)});p.on('error',e=>{console.error('[BACKSTAB] PeerJS error',e);if(!done){done=true;clearTimeout(timer);reject(e)}else setStatus('PeerJS error: '+errorText(e))})})}
function watchConnection(c,label){c.on('open',()=>setStatus(label+' data channel opened.'));const pc=c.peerConnection;if(pc){const report=()=>setStatus(label+' ICE: '+pc.iceConnectionState+' / '+pc.connectionState);pc.addEventListener('iceconnectionstatechange',report);pc.addEventListener('connectionstatechange',report);pc.addEventListener('icegatheringstatechange',()=>console.log('[BACKSTAB] ICE gathering:',pc.iceGatheringState));pc.addEventListener('icecandidateerror',e=>{console.error('[BACKSTAB] ICE candidate error',e);setStatus(label+' TURN error '+(e.errorCode||'unknown')+'.')})}}
function replace(id,fn){const old=$(id);if(!old)return;const n=old.cloneNode(true);old.replaceWith(n);n.addEventListener('click',fn)}
async function host(){const b=$('hostBtn');if(b.disabled)return;if(!window.RTCPeerConnection){setStatus('This browser does not support WebRTC.');return}b.disabled=true;isHost=true;myId='host';chooseMap();const s=spawnFor('host');me={x:s[0],y:s[1],a:s[2],alive:true};players={host:{id:'host',x:me.x,y:me.y,a:me.a,alive:true,k:0}};const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<4;i++)code+=chars[Math.floor(Math.random()*chars.length)];$('partyCode').textContent=code;$('hostWait').textContent='Starting TURN relay...';setStatus('Connecting host to signaling server...');try{await newPeer(peerId(code));peer.on('connection',c=>{if(hostConns.length>=MAX-1){c.close();return}hostConns.push(c);watchConnection(c,'Host');wire(c);setStatus('Player connection negotiating through TURN...')});$('mapName').textContent=mapName;$('hostWait').textContent='Share this code with the other player.';start();setStatus('Party '+code+' is ready. TURN relay enabled.')}catch(e){isHost=false;b.disabled=false;setStatus('Host error: '+errorText(e));if(e&&e.type==='unavailable-id')setStatus('That party ID was already occupied. Press Host again for a new code.')}}
async function join(){const b=$('joinBtn');if(b.disabled)return;if(!window.RTCPeerConnection){setStatus('This browser does not support WebRTC.');return}const code=$('partyInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code)){setStatus('Enter exactly 4 letters/numbers.');return}b.disabled=true;isHost=false;myId=Math.random().toString(36).slice(2,10);setStatus('Connecting to signaling server...');try{await newPeer();setStatus('Signaling connected. Contacting host through TURN...');conn=peer.connect(peerId(code),{reliable:false,serialization:'json'});watchConnection(conn,'Join');wire(conn);let finished=false;const timer=setTimeout(()=>{if(finished)return;finished=true;try{conn.close()}catch(e){}b.disabled=false;setStatus('TURN connection timed out. The relay credentials/server are not accepting this connection.');},20000);conn.on('open',()=>{if(finished)return;finished=true;clearTimeout(timer);setStatus('Connected through TURN! Loading arena...');send(conn,{t:'hello',id:myId})});conn.on('error',e=>{if(finished)return;finished=true;clearTimeout(timer);b.disabled=false;setStatus('Connection error: '+errorText(e))})}catch(e){b.disabled=false;setStatus('PeerJS error: '+errorText(e))}}
replace('hostBtn',host);replace('joinBtn',join);
})();
</script>
</body>
</html>
