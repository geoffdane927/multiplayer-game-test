<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backstab — P2P Raycast Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu" class="panel">
<h1>BACKSTAB</h1><p>Random arenas. Hunt the other player.</p>
<div class="tabs"><button id="hostTab" type="button">Host</button><button id="joinTab" type="button">Join</button></div>
<section id="hostPanel">
<h2>Create a Party</h2>
<p>Your 4-letter party code:</p>
<div id="partyCode" class="party-code">----</div>
<p id="hostWait" class="hint">Press Host to create a party.</p>
<button id="hostBtn" type="button">Host</button>
</section>
<section id="joinPanel" hidden>
<h2>Join a Party</h2>
<p>Enter the host's 4-letter party code:</p>
<input id="partyInput" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD" aria-label="Party code">
<button id="joinBtn" type="button">Join</button>
</section>
<div id="status">Choose Host or Join.</div>
</div>
<canvas id="game" hidden></canvas>
<div id="hud" hidden><b>BACKSTAB</b><span id="mapName">Arena</span><span id="players">Players: 1</span><span id="state">Waiting...</span><span>WASD move · mouse look · SPACE stab</span></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game2.js"></script>
</body></html>
