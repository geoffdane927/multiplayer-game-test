<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BACKSTAB</title>
</head>
<body>
<div id="controlPrompt">
<h2>Choose Controls</h2>
<p>How do you want to play?</p>
<button type="button" onclick="window.selectBackstabControls('keyboard')">Keyboard + Mouse</button>
<button type="button" onclick="window.selectBackstabControls('touch')">Touch</button>
<p id="controlError"></p>
</div>

<main id="menu" hidden>
<h1>BACKSTAB</h1>
<p>Random arenas. Hunt the other players.</p>
<p><button id="hostTab" type="button">Host</button> <button id="joinTab" type="button">Join</button></p>
<section id="hostPanel">
<h2>Host</h2>
<p>Party code: <strong id="partyCode">----</strong></p>
<p id="hostWait">Press Host to create a party.</p>
<button id="hostBtn" type="button">Host</button>
</section>
<section id="joinPanel" hidden>
<h2>Join</h2>
<p>Enter the host's 4-character party code.</p>
<input id="partyInput" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD" aria-label="Party code">
<button id="joinBtn" type="button">Join</button>
</section>
<p id="status">Choose Host or Join.</p>
</main>

<canvas id="game" hidden></canvas>
<div id="hud" hidden>
<strong>BACKSTAB</strong>
<span id="mapName">Arena</span>
<span id="players">Players: 1</span>
<span id="state">Waiting...</span>
<span id="controlHint">WASD · mouse · SPACE</span>
</div>
<div id="touchControls" hidden>
<div id="lookArea"></div>
<div id="stick"><div id="knob"></div></div>
<button id="stabTouch" type="button">STAB</button>
</div>

<script>
/* This is deliberately inline: it does not depend on game2.js loading. */
window.selectBackstabControls=function(mode){
  window.gameControlMode=mode;
  var prompt=document.getElementById('controlPrompt');
  var menu=document.getElementById('menu');
  if(mode==='touch')document.body.setAttribute('data-controls','touch');
  else document.body.setAttribute('data-controls','keyboard');
  prompt.hidden=true;
  menu.hidden=false;
};
</script>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
window.addEventListener('error',function(e){
  var text='Game script error: '+(e.message||'unknown error');
  var s=document.getElementById('status');
  var p=document.getElementById('controlError');
  if(s)s.textContent=text;
  if(p)p.textContent=text;
});
window.addEventListener('unhandledrejection',function(e){
  var text='Game error: '+(e.reason&&e.reason.message?e.reason.message:e.reason||'unknown error');
  var s=document.getElementById('status');
  var p=document.getElementById('controlError');
  if(s)s.textContent=text;
  if(p)p.textContent=text;
});
</script>
<script src="game2.js"></script>
</body>
</html>
