<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BACKSTAB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;color:#eee;font-family:system-ui,sans-serif}
button,input{font:inherit}
button{border:1px solid #555;background:#242832;color:#fff;padding:10px 18px;border-radius:7px;cursor:pointer}
button:hover{background:#303641}
button:disabled{opacity:.5;cursor:default}
#menu{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);padding:28px;background:#191c23;border:1px solid #343943;border-radius:12px;box-shadow:0 16px 50px #0008}
#menu h1{margin:0 0 4px;font-size:42px;letter-spacing:4px}
#menu p{color:#b9bec8}
#menu section{margin-top:20px;padding:18px;background:#12151a;border-radius:8px}
#partyInput{width:110px;text-transform:uppercase;padding:9px;background:#0e1014;color:#fff;border:1px solid #555;border-radius:6px}
#status{min-height:1.4em}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#hud{position:fixed;z-index:2;left:14px;top:12px;display:flex;gap:14px;align-items:center;padding:9px 12px;background:#11151bcc;border:1px solid #3b4049;border-radius:8px;font-size:14px;pointer-events:none}
#hud strong{letter-spacing:2px}
#hud span{color:#c5cad2}
#controlPrompt{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d11}
#controlPrompt .box{width:min(90vw,430px);padding:28px;text-align:center;background:#191c23;border:1px solid #3b4049;border-radius:12px;box-shadow:0 20px 60px #0009}
#controlPrompt h2{margin-top:0}
#controlPrompt button{min-width:150px;margin:6px}
#touchControls{position:fixed;z-index:10;inset:0;pointer-events:none;touch-action:none}
#stick{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:56px;height:56px;border-radius:50%;background:#ffffff55}
#lookArea{position:absolute;right:0;top:0;width:65%;height:100%;pointer-events:auto}
#stabTouch{position:absolute;right:28px;bottom:38px;width:105px;height:105px;border-radius:50%;background:#8b2525cc;border:2px solid #ffffff66;color:#fff;font-weight:700;pointer-events:auto}
.touchMode #game{cursor:default}
@media(max-width:700px){#hud{font-size:11px;gap:7px;padding:7px}.hideTouch{display:none!important}}
</style>
</head>
<body>
<div id="controlPrompt">
<div class="box">
<h2>Choose Controls</h2>
<p>How do you want to play?</p>
<button id="keyboardChoice" type="button">Keyboard + Mouse</button>
<button id="touchChoice" type="button">Touch</button>
</div>
</div>
<main id="menu" hidden>
<h1>BACKSTAB</h1>
<p>Random arenas. Hunt the other players.</p>
<p><button id="hostTab" type="button">Host</button> <button id="joinTab" type="button">Join</button></p>
<section id="hostPanel">
<h2>Host</h2>
<p>Party code: <strong id="partyCode">----</strong></p>
<p id="hostWait">Press Host to create a party.</p>
<button id="hostBtn" type="button">Host</button>
</section>
<section id="joinPanel" hidden>
<h2>Join</h2>
<p>Enter the host's 4-character party code.</p>
<input id="partyInput" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD" aria-label="Party code">
<button id="joinBtn" type="button">Join</button>
</section>
<p id="status">Choose Host or Join.</p>
</main>
<canvas id="game" hidden></canvas>
<div id="hud" hidden>
<strong>BACKSTAB</strong>
<span id="mapName">Arena</span>
<span id="players">Players: 1</span>
<span id="state">Waiting...</span>
<span id="controlHint">WASD · mouse · SPACE</span>
</div>
<div id="touchControls" hidden>
<div id="lookArea"></div>
<div id="stick"><div id="knob"></div></div>
<button id="stabTouch" type="button">STAB</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
window.addEventListener('error',function(e){const s=document.getElementById('status');if(s)s.textContent='Game script error: '+(e.message||'unknown error')});
window.addEventListener('unhandledrejection',function(e){const s=document.getElementById('status');if(s)s.textContent='Game error: '+(e.reason?.message||e.reason||'unknown error')});
</script>
<script src="game2.js"></script>
</body>
</html>
